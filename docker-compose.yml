services:
  postgres:
    image: postgres:16
    container_name: n8n-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  n8n:
    image: n8nio/n8n:2.28.4
    container_name: n8n
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

    ports:
      - "5678:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      WEBHOOK_URL: ${WEBHOOK_URL}

      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      N8N_PROTOCOL: ${N8N_PROTOCOL}

      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}

      # Avoid Docker DNS flakes (EAI_AGAIN) on outbound Slack/Gmail/Google calls
      NODE_OPTIONS: --dns-result-order=ipv4first

    dns:
      - 8.8.8.8
      - 1.1.1.1

    volumes:
      - n8n_data:/home/node/.n8n

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_N8N_URL: ${NEXT_PUBLIC_N8N_URL:-http://localhost:5678}
        NEXT_PUBLIC_KIT_NAME: ${NEXT_PUBLIC_KIT_NAME:-S-C Automation Kit}
    container_name: n8n-dashboard
    restart: unless-stopped

    depends_on:
      n8n:
        condition: service_healthy

    ports:
      - "3000:3000"

    environment:
      N8N_API_KEY: ${N8N_API_KEY}
      N8N_INTERNAL_URL: http://n8n:5678
      NEXT_PUBLIC_N8N_URL: ${NEXT_PUBLIC_N8N_URL:-http://localhost:5678}
      NEXT_PUBLIC_KIT_NAME: ${NEXT_PUBLIC_KIT_NAME:-S-C Automation Kit}

volumes:
  postgres_data:
  n8n_data: